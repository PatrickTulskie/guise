name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A superseded push has nothing left to tell us.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    # macOS covers BSD tools and the osxkeychain helper the rendered git
    # config has to override. Linux covers the GNU tool variants that
    # cloud-hosted coding agents run on. Git Bash takes 25 minutes a run, so it
    # lives in windows.yml on a schedule instead of here.
    runs-on: ${{ matrix.os }}
    # The macOS runner has finished the suite within seconds of ten minutes.
    timeout-minutes: 20
    steps:
      # Pinned by commit: a tag is mutable, and this job runs test code from the
      # PR branch. Nothing here talks to a remote, so the checkout token has no
      # reason to sit in .git/config while that code runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The suite builds guise, then needs git, openssl, jq, and ssh-keygen;
      # op, curl, and gh are stubbed by the harness. Logged so a runner image
      # that moves a tool out from under the suite shows up here instead of as
      # a mystery failure.
      - name: Record the environment under test
        run: |
          go version
          bash --version | head -1
          git --version
          openssl version
          jq --version
          ssh -V

      - name: make vet
        run: make vet

      - name: tests/run.sh
        run: bash tests/run.sh

  wsl:
    name: wsl (ubuntu)
    # WSL is Linux, so this mostly guards the Windows side of it: the checkout
    # sits on the Windows disk, reached through /mnt, and the Windows tools are
    # on PATH beside the Linux ones.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built on the Windows side for Linux: installing Go inside the distro
      # takes longer than the suite does, and the suite runs whatever binary
      # it finds at bin/guise when it has no toolchain of its own.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cross-compile guise for the distro
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o bin/guise ./cmd/guise

      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: git jq openssl openssh-client

      - name: Record the environment under test
        shell: wsl-bash {0}
        run: |
          bash --version | head -1
          git --version
          openssl version
          jq --version
          ssh -V
          uname -r
          pwd

      - name: tests/run.sh
        shell: wsl-bash {0}
        run: bash tests/run.sh
