name: Release

# Publishing a release on GitHub builds guise for every platform and attaches
# the archives to it. Run it by hand to rebuild the assets of an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: the release tag to attach the builds to
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build and attach
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The tag names the version the source should report, or the archives
      # would carry one number and the binary inside another.
      - name: Check the version matches the tag
        run: |
          built=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/guise/main.go)
          [ "v$built" = "$TAG" ] || { echo "source is $built, tag is $TAG"; exit 1; }

      - name: make dist
        run: make dist

      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
